# Builds the Noto collector distribution with ocb and validates the rendered
# configs against the RESULTING binary - proving the manifest's component set is
# sufficient for everything the renderers emit. Path-filtered: runs only when the
# distro, the renderers, or this workflow change.
name: distro

on:
  pull_request:
    paths:
      - "distro/**"
      - "agent/noto/rendering/**"
      - ".github/workflows/distro.yml"
  push:
    branches: [main]
    paths:
      - "distro/**"
      - "agent/noto/rendering/**"
      - ".github/workflows/distro.yml"

permissions:
  contents: read

jobs:
  build-and-validate:
    name: ocb build + validate against own binary
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # A self-hosted runner must never run a fork's code: this repository's own pull
    # requests and pushes only. Harmless on GitHub-hosted runners.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.5" # pinned; 0.154's generics need >= 1.26 linker (docs/versions.md)
          cache-dependency-path: distro/manifest.yaml
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
      - name: Fetch pinned ocb
        run: |
          # Into the runner's own temp dir, not /usr/local/bin: a self-hosted runner
          # user does not own system paths, and the tool only needs to be on PATH.
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/cmd%2Fbuilder%2Fv0.154.0/ocb_0.154.0_linux_amd64" -o "$RUNNER_TEMP/bin/ocb"
          chmod +x "$RUNNER_TEMP/bin/ocb"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/ocb" version
      - name: Build the distro
        run: cd distro && ocb --config manifest.yaml
      - name: Validate rendered configs against the built binary
        env:
          KUBE_NODE_NAME: validation-node
          POD_NAME: validation-pod
        run: |
          # The collector's kubernetes components read the pod service-account
          # files at validate time. A hosted runner has none, so a placeholder is
          # written with sudo; a self-hosted runner that is itself a pod already
          # has real ones mounted there and has no sudo, so nothing is written.
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          if [ ! -r "$SA/token" ]; then
            AS_ROOT=""; command -v sudo >/dev/null && AS_ROOT=sudo
            $AS_ROOT mkdir -p "$SA"
            openssl req -x509 -newkey rsa:2048 -nodes -keyout /dev/null -out /tmp/ca.crt -days 1 -subj "/CN=noto-validation-placeholder" 2>/dev/null
            $AS_ROOT cp /tmp/ca.crt "$SA/ca.crt"
            echo placeholder | $AS_ROOT tee "$SA/token" >/dev/null
            $AS_ROOT chmod -R a+rX /var/run/secrets
          fi
          uv run python scripts/render-for-validation.py .noto/rendered
          for cfg in .noto/rendered/otelcol/*.yaml; do
            ./distro/_build/noto-otelcol validate --config="$cfg"
            echo "ok: $(basename "$cfg")"
          done
