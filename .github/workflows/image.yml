# Publishes the argus image (the Dockerfile at the repo root) once the existing CI
# gates have passed for a commit on main.
#
# Gated via `workflow_run` on the `ci` workflow rather than folding a conditional job
# into ci.yml: ci.yml triggers on both `pull_request` and `push` to main, so folding
# would need an extra guard to skip pull requests here anyway, while `workflow_run`
# already fires only after ci.yml finishes and carries its own conclusion to check -
# the simpler of the two options.
name: image

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-push:
    name: build + push
    runs-on: ubuntu-latest
    # Nothing runs until a registry to publish to is actually configured, and (for the
    # workflow_run trigger, which fires on both success and failure) only once ci itself
    # has passed. workflow_dispatch has no workflow_run conclusion to check - a manual
    # run is the operator's own call.
    if: >-
      vars.ARGUS_IMAGE != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute the image tag and registry host
        id: vars
        env:
          ARGUS_IMAGE: ${{ vars.ARGUS_IMAGE }}
        run: |
          sha="$(git rev-parse HEAD)"
          tag="${sha:0:7}"
          host="${ARGUS_IMAGE%%/*}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "host=${host}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to the build identity
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SA }}
          token_format: access_token

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.vars.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ vars.ARGUS_IMAGE }}:${{ steps.vars.outputs.tag }}

      - name: Record the pinned reference
        env:
          ARGUS_IMAGE: ${{ vars.ARGUS_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Pinned image reference: \`${ARGUS_IMAGE}@${DIGEST}\`"
            echo
            echo "A provisioner's Job config pins this exact digest, never a mutable tag."
          } >> "$GITHUB_STEP_SUMMARY"
