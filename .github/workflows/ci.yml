# Noto CI - the per-PR gate.
#
# Mirrors the test layers in docs/testing.md, cheapest first. This skeleton runs the
# static layer today; the unit and contract jobs below activate as the agent code and
# rendered artifacts land. The integration/smoke layer (layer 4) is gated separately and
# does not run here.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # release.yml runs all of this on the tagged commit before it publishes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Layer 1: static / lint. No code execution, runs in seconds.
  conventions:
    name: conventions lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint prose and version pins
        run: ./scripts/lint-conventions.sh

  # Layers 1-3: static (ruff), unit, contract - `make test` runs them all.
  unit-and-contract:
    name: unit + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
      - name: Run test layers 1-3
        # The make recipes, inline: a self-hosted runner image ships no make.
        run: |
          ./scripts/lint-conventions.sh
          uv run ruff check .
          uv run ruff format --check .
          uv sync --frozen
      - name: Architecture cards are current
        # Each card pins the file it describes by blob sha; a seam that changed
        # without its card fails here (see AGENTS.md).
        run: uv run --frozen python scripts/check_arch_cards.py
      - name: Unit and contract suites
        # One `run:` line per command. From 2026-10-06 (#87) to this fix the two
        # pytest lines were folded into the card checker's argument list and
        # never ran; every green run in between tested nothing past ruff.
        run: |
          uv run pytest tests/unit
          uv run pytest tests/contract -m contract

  # Layer 3.5: rendered artifacts judged by the REAL consumers' validators
  # (otelcol validate, sloth generate, kubeconform, percli lint - pinned versions).
  # The one layer where something outside our own expectations judges the output.
  rendered-validation:
    name: rendered vs real validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
      - name: Validate rendered artifacts
        run: bash scripts/validate-rendered.sh

  # Layer 1 (static) for the OpenTofu seams: fmt + validate with the pinned CLI.
  opentofu:
    name: opentofu fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.3"
          # The wrapper is a node script; a self-hosted runner image has no node on PATH.
          tofu_wrapper: false
      - name: fmt
        run: tofu fmt -check -recursive terraform/
      - name: validate example (wires both modules)
        run: |
          cd terraform/examples/gcp-solo
          tofu init -backend=false -input=false
          tofu validate

  # Real-tool validation for the Helm layer: every pinned chart must template
  # cleanly with our values. Runs on every PR (chart fetches are ~seconds).
  helm-values:
    name: pinned charts template with our values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
      # Hosted images ship helm; a self-hosted runner image does not.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: "v3.19.0"
      - name: Validate helm pins + values
        run: bash scripts/validate-helm.sh

  # The one check the branch rules require: it passes only when every job above passed.
  # A skipped or cancelled job fails it, so nothing merges on a job that did not run.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [conventions, unit-and-contract, rendered-validation, opentofu, helm-values]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "a job did not pass: $RESULTS"; exit 1; }
          done
