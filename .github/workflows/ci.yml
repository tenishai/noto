# Argus CI - the per-PR gate.
#
# Mirrors the test layers in docs/testing.md, cheapest first. This skeleton runs the
# static layer today; the unit and contract jobs below activate as the agent code and
# rendered artifacts land. The integration/smoke layer (layer 4) is gated separately and
# does not run here.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Layer 1: static / lint. No code execution, runs in seconds.
  conventions:
    name: conventions lint
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # A self-hosted runner must never run a fork's code: this repository's own pull
    # requests and pushes only. Harmless on GitHub-hosted runners.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v6
      - name: Lint prose and version pins
        run: ./scripts/lint-conventions.sh

  # Layers 1-3: static (ruff), unit, contract - `make test` runs them all.
  unit-and-contract:
    name: unit + contract
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # A self-hosted runner must never run a fork's code: this repository's own pull
    # requests and pushes only. Harmless on GitHub-hosted runners.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.28"
      - name: Run test layers 1-3
        # The make recipes, inline: a self-hosted runner image ships no make.
        run: |
          ./scripts/lint-conventions.sh
          uv run ruff check .
          uv run ruff format --check .
          uv sync --frozen
          uv run pytest tests/unit
          uv run pytest tests/contract -m contract

  # Layer 3.5: rendered artifacts judged by the REAL consumers' validators
  # (otelcol validate, sloth generate, kubeconform, percli lint - pinned versions).
  # The one layer where something outside our own expectations judges the output.
  rendered-validation:
    name: rendered vs real validators
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # A self-hosted runner must never run a fork's code: this repository's own pull
    # requests and pushes only. Harmless on GitHub-hosted runners.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.28"
      - name: Validate rendered artifacts
        run: bash scripts/validate-rendered.sh

  # Layer 1 (static) for the OpenTofu seams: fmt + validate with the pinned CLI.
  opentofu:
    name: opentofu fmt + validate
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # A self-hosted runner must never run a fork's code: this repository's own pull
    # requests and pushes only. Harmless on GitHub-hosted runners.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.3"
          # The wrapper is a node script; a self-hosted runner image has no node on PATH.
          tofu_wrapper: false
      - name: fmt
        run: tofu fmt -check -recursive terraform/
      - name: validate example (wires both modules)
        run: |
          cd terraform/examples/gcp-solo
          tofu init -backend=false -input=false
          tofu validate

  # Real-tool validation for the Helm layer: every pinned chart must template
  # cleanly with our values. Runs on every PR (chart fetches are ~seconds).
  helm-values:
    name: pinned charts template with our values
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # A self-hosted runner must never run a fork's code: this repository's own pull
    # requests and pushes only. Harmless on GitHub-hosted runners.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.28"
      # Hosted images ship helm; a self-hosted runner image does not.
      - uses: azure/setup-helm@v4
        with:
          version: "v3.19.0"
      - name: Validate helm pins + values
        run: bash scripts/validate-helm.sh
