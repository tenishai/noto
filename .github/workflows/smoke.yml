# Layer 4: the Phase 1 DoD gate (testing.md). Gated: on demand and on release,
# never per-PR (it stands up the full solo platform on kind, ~15 minutes).
name: smoke

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  solo-dod:
    name: kind solo platform - definition of done
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # A self-hosted runner must never run a fork's code: this repository's own pull
    # requests and pushes only. Harmless on GitHub-hosted runners.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.28"
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      # kind-action installs kind and kubectl only; the platform steps shell out to
      # helm, and the self-hosted runner image ships neither helm nor make (the
      # v0.1.0 and v0.2.0 release runs both failed on exactly that).
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Fetch pinned tools and validate the rendered artifacts
        # A failure here is a failure: the smoke test renders the same artifacts,
        # so an invalid render must stop the run, not hide behind || true.
        run: bash scripts/validate-rendered.sh
      - name: Run the smoke test
        run: bash tests/smoke/run-smoke.sh
