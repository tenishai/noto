# Layer 4: the Phase 1 DoD gate (testing.md). Gated: on demand and on release,
# never per-PR (it stands up the full solo platform on kind, ~15 minutes).
name: smoke

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  solo-dod:
    name: kind solo platform - definition of done
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # A self-hosted runner must never run a fork's code: this repository's own pull
    # requests and pushes only. Harmless on GitHub-hosted runners.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      - name: Fetch pinned tools (sloth for SLO generation)
        run: bash -c 'source /dev/stdin <<< "$(sed -n "/^fetch/,/^$/p" scripts/validate-rendered.sh)" 2>/dev/null || true; make validate || true'
      - name: Run the smoke test
        run: bash tests/smoke/run-smoke.sh
