[project]
name = "tenish-argus"
version = "0.1.0.dev0"
description = "Argus - the observability arm of gojira. Takes a deployment from zero to a full open-source observability platform, automatically."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14,<3.15"
authors = [{ name = "tenish" }]
# Runtime dependencies land with the code that needs them (Jinja2 with the renderers,
# PyYAML with the gojira-reader, anthropic with the agent) - each pinned in docs/versions.md
# at introduction time.
dependencies = [
    "pydantic==2.14.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[project.scripts]
argus = "argus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent/argus"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["agent"]
# A vendored copy, kept byte-identical with its source, so ruff leaves it alone.
# docs/ holds historical plans with code fences; ruff 0.16 formats fenced code, and
# a dated record is not reformatted after the fact.
extend-exclude = ["scripts/check_arch_cards.py", "docs/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-native
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Python 3.14 site ignores underscore-prefixed .pth files, which breaks hatchling's
# editable install (_editable_impl_argus.pth). pythonpath makes tests independent of it.
pythonpath = ["agent", "."]
addopts = "-q --strict-markers"
markers = [
    "contract: golden-file / rendered-output assertions (layer 3)",
]
