# Loki (solo baseline). Spike gotchas encoded (docs/spikes/perses/RESULTS.md):
# structured metadata + OTLP index labels, or OTLP-ingested labels are unqueryable.
deploymentMode: SingleBinary
loki:
  auth_enabled: true             # tenant per cluster
  storage:
    # Placeholders so the chart templates/validates; the engine overrides these at
    # apply time from the object-storage seam outputs (terraform/modules).
    bucketNames: { chunks: argus-loki-chunks-PLACEHOLDER, ruler: argus-loki-ruler-PLACEHOLDER, admin: argus-loki-admin-PLACEHOLDER }
  commonConfig: { replication_factor: 1 }
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: gcs        # engine overrides per cloud seam
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    allow_structured_metadata: true
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes: [service.name, k8s.namespace.name, k8s.cluster.name]
singleBinary: { replicas: 1 }
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
gateway: { enabled: false }
