# Loki (solo baseline). Spike gotchas encoded (docs/spikes/perses/RESULTS.md):
# structured metadata + OTLP index labels, or OTLP-ingested labels are unqueryable.
deploymentMode: SingleBinary
loki:
  auth_enabled: true             # tenant per cluster
  storage:
    # Solo topology default: filesystem (single-node backends, no cloud deps).
    # Production/regional: the engine overrides type + bucketNames from seam outputs.
    type: filesystem
  commonConfig: { replication_factor: 1 }
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem # solo default; engine overrides per cloud seam
        schema: v13
        index: { prefix: index_, period: 24h }
  compactor:
    # Retention is switched on at apply time from the profile promise
    # (`--set loki.compactor.retention_enabled=true`, see steps.retention_helm_sets), and
    # loki refuses to start with retention enabled and no delete request store:
    # "compactor.delete-request-store should be configured when retention is enabled"
    # (verified against the pinned chart's app, loki 3.7.3). Solo default: the same
    # filesystem backend as `storage.type` above, which the engine overrides per cloud seam.
    delete_request_store: filesystem
  limits_config:
    allow_structured_metadata: true
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes: [service.name, k8s.namespace.name, k8s.cluster.name]
singleBinary: { replicas: 1 }
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
gateway: { enabled: false }
