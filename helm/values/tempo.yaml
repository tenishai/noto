# Tempo (monolithic chart, solo baseline). Metrics-generator owns span-metrics and
# the service graph (design decision; spike-verified) - remote-writes into Mimir.
tempo:
  multitenancyEnabled: true
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://mimir-nginx.noto.svc:80/api/v1/push  # engine overrides
  overrides:
    defaults:
      metrics_generator:
        processors: [service-graphs, span-metrics]
