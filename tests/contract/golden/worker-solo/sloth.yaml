apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  labels:
    argus.dev/class: worker
    argus.dev/managed: 'true'
  name: argus-slo-sample-worker
  namespace: sample
spec:
  labels:
    cluster: golden-cluster
    environment: prod
  service: sample-worker
  slos:
  - alerting:
      name: ArgusSLO-sample-worker-availability-99.5
      pageAlert:
        labels:
          severity: page
      ticketAlert:
        labels:
          severity: ticket
    description: Argus worker profile SLO availability-99.5 for sample-worker
    name: availability-99.5
    objective: 99.5
    sli:
      events:
        errorQuery: sum(rate(http_server_request_duration_seconds_count{job="sample-worker",
          k8s_namespace_name="sample", status_code=~"5.."}[{{.window}}]))
        totalQuery: sum(rate(http_server_request_duration_seconds_count{job="sample-worker",
          k8s_namespace_name="sample"}[{{.window}}]))
