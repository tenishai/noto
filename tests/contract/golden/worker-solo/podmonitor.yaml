apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    app.kubernetes.io/name: sample-worker
    argus.dev/class: worker
    argus.dev/managed: 'true'
  name: sample-worker
  namespace: sample
spec:
  podMetricsEndpoints:
  - interval: 15s
    path: /metrics
    port: http
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-worker
