apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  labels:
    argus.dev/cluster: golden-cluster
    argus.dev/managed: 'true'
    argus.dev/role: agent
  name: argus-agent
  namespace: argus
spec:
  config:
    exporters:
      otlp/gateway:
        compression: zstd
        endpoint: argus-gateway-collector.argus.svc:4317
        tls:
          insecure: true
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      k8s_observer:
        auth_type: serviceAccount
        observe_pods: true
        observe_services: false
      pprof: {}
      zpages: {}
    processors:
      batch:
        send_batch_max_size: 2000
        send_batch_size: 1000
        timeout: 1s
      filter/argus-agent:
        error_mode: ignore
        logs:
          log_record:
          - IsMatch(attributes["url.path"], "^(/health|/healthz|/ready|/livez)")
          - severity_number < SEVERITY_NUMBER_INFO
        traces:
          span:
          - IsMatch(attributes["url.path"], "^(/health|/healthz|/ready|/livez)")
      k8sattributes:
        filter:
          node_from_env_var: KUBE_NODE_NAME
        passthrough: true
      memory_limiter:
        check_interval: 1s
        limit_percentage: 90
        spike_limit_percentage: 10
      resourcedetection:
        detectors:
        - env
        - system
    receivers:
      filelog:
        include:
        - /var/log/pods/*/*/*.log
        include_file_path: true
        operators:
        - type: container
      hostmetrics:
        collection_interval: 60s
        scrapers:
          cpu: {}
          filesystem: {}
          load: {}
          memory: {}
      kubeletstats:
        auth_type: serviceAccount
        collection_interval: 30s
        endpoint: https://${env:KUBE_NODE_NAME}:10250
        insecure_skip_verify: true
        metric_groups:
        - pod
        - container
        - node
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      receiver_creator:
        receivers:
          nginx/argus-nginx:
            config:
              collection_interval: 30s
              endpoint: http://`endpoint`/stub_status
            rule: type == "port" and (pod.labels["argus.dev/integration"] == "nginx"
              or port == 80)
          redis/argus-redis:
            config:
              collection_interval: 30s
              endpoint: '`endpoint`'
            rule: type == "port" and (pod.labels["argus.dev/integration"] == "redis"
              or port == 6379)
        watch_observers:
        - k8s_observer
      statsd:
        endpoint: 0.0.0.0:8125
    service:
      extensions:
      - health_check
      - zpages
      - pprof
      - k8s_observer
      pipelines:
        logs:
          exporters:
          - otlp/gateway
          processors:
          - memory_limiter
          - k8sattributes
          - resourcedetection
          - filter/argus-agent
          - batch
          receivers:
          - otlp
          - filelog
        metrics:
          exporters:
          - otlp/gateway
          processors:
          - memory_limiter
          - k8sattributes
          - resourcedetection
          - filter/argus-agent
          - batch
          receivers:
          - otlp
          - kubeletstats
          - hostmetrics
          - receiver_creator
  env:
  - name: KUBE_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  mode: daemonset
