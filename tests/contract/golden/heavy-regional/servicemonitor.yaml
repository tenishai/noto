apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: sample-heavy
    argus.dev/class: heavy
    argus.dev/managed: 'true'
  name: sample-heavy
  namespace: sample
spec:
  endpoints:
  - interval: 15s
    path: /metrics
    port: http
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-heavy
