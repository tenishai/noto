apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  labels:
    argus.dev/cluster: golden-cluster
    argus.dev/managed: 'true'
    argus.dev/role: ingest
  name: argus-ingest
  namespace: argus
spec:
  config:
    exporters:
      otlp/tempo:
        compression: zstd
        endpoint: tempo.us-east4.argus.internal:4317
        headers:
          X-Scope-OrgID: golden-cluster
        retry_on_failure:
          enabled: true
        sending_queue:
          num_consumers: 50
          queue_size: 1000
        timeout: 30s
        tls:
          insecure: true
      otlphttp/loki:
        compression: zstd
        endpoint: http://loki.us-east4.argus.internal:3100/otlp
        headers:
          X-Scope-OrgID: golden-cluster
        retry_on_failure:
          enabled: true
        sending_queue:
          num_consumers: 50
          queue_size: 1000
        timeout: 30s
      otlphttp/mimir:
        compression: zstd
        endpoint: http://mimir.us-east4.argus.internal:9009/otlp
        headers:
          X-Scope-OrgID: golden-cluster
        retry_on_failure:
          enabled: true
        sending_queue:
          num_consumers: 50
          queue_size: 1000
        timeout: 30s
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      pprof: {}
      zpages: {}
    processors:
      batch:
        send_batch_max_size: 2000
        send_batch_size: 1000
        timeout: 1s
      memory_limiter:
        check_interval: 1s
        limit_percentage: 90
        spike_limit_percentage: 10
    receivers:
      kafka:
        brokers:
        - redpanda.us-east4.argus.internal:9092
        encoding: otlp_proto
        protocol_version: 2.6.0
    service:
      extensions:
      - health_check
      - zpages
      - pprof
      pipelines:
        logs:
          exporters:
          - otlphttp/loki
          processors:
          - memory_limiter
          - batch
          receivers:
          - kafka
        metrics:
          exporters:
          - otlphttp/mimir
          processors:
          - memory_limiter
          - batch
          receivers:
          - kafka
  mode: deployment
