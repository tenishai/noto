apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  labels:
    noto.dev/class: web
    noto.dev/managed: 'true'
  name: noto-slo-sample-web
  namespace: sample
spec:
  labels:
    cluster: golden-cluster
    environment: prod
  service: sample-web
  slos:
  - alerting:
      name: NotoSLO-sample-web-availability-99.9
      pageAlert:
        labels:
          severity: page
      ticketAlert:
        labels:
          severity: ticket
    description: Noto web profile SLO availability-99.9 for sample-web
    labels:
      app: sample-web
      class: web
      namespace: sample
    name: availability-99.9
    objective: 99.9
    sli:
      events:
        errorQuery: sum(rate(http_requests_total{job="sample-web", namespace="sample",
          status=~"5.."}[{{.window}}]))
        totalQuery: sum(rate(http_requests_total{job="sample-web", namespace="sample"}[{{.window}}]))
  - alerting:
      name: NotoSLO-sample-web-latency-p99-500ms
      pageAlert:
        labels:
          severity: page
      ticketAlert:
        labels:
          severity: ticket
    description: Noto web profile SLO latency-p99-500ms for sample-web
    labels:
      app: sample-web
      class: web
      namespace: sample
    name: latency-p99-500ms
    objective: 99.0
    sli:
      events:
        errorQuery: (sum(rate(http_request_duration_seconds_count{job="sample-web",
          namespace="sample"}[{{.window}}])) - sum(rate(http_request_duration_seconds_bucket{job="sample-web",
          namespace="sample", le="0.5"}[{{.window}}])))
        totalQuery: sum(rate(http_request_duration_seconds_count{job="sample-web",
          namespace="sample"}[{{.window}}]))
