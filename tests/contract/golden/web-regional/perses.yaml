- kind: Project
  metadata:
    name: golden-cluster
  spec:
    display:
      name: "Noto \xB7 golden-cluster"
- kind: Datasource
  metadata:
    name: mimir
    project: golden-cluster
  spec:
    default: true
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            headers:
              X-Scope-OrgID: golden-cluster
            url: http://mimir.us-east4.noto.internal:9009/prometheus
- kind: Datasource
  metadata:
    name: loki
    project: golden-cluster
  spec:
    default: true
    plugin:
      kind: LokiDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            headers:
              X-Scope-OrgID: golden-cluster
            url: http://loki.us-east4.noto.internal:3100
- kind: Datasource
  metadata:
    name: tempo
    project: golden-cluster
  spec:
    default: true
    plugin:
      kind: TempoDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            headers:
              X-Scope-OrgID: golden-cluster
            url: http://tempo.us-east4.noto.internal:3200
- kind: Dashboard
  metadata:
    name: cluster-baseline
    project: golden-cluster
  spec:
    display:
      name: "Cluster \xB7 Baseline"
    duration: 1h
    layouts:
    - kind: Grid
      spec:
        items:
        - content:
            $ref: '#/spec/panels/metric-node-cpu'
          height: 8
          width: 12
          x: 0
          y: 0
        - content:
            $ref: '#/spec/panels/metric-node-memory'
          height: 8
          width: 12
          x: 12
          y: 0
        - content:
            $ref: '#/spec/panels/metric-pod-restarts'
          height: 8
          width: 12
          x: 0
          y: 8
        - content:
            $ref: '#/spec/panels/logs-cluster-errors'
          height: 8
          width: 12
          x: 12
          y: 8
    panels:
      logs-cluster-errors:
        kind: Panel
        spec:
          display:
            name: Cluster Errors (Logs)
          plugin:
            kind: LogsTable
            spec: {}
          queries:
          - kind: LogQuery
            spec:
              plugin:
                kind: LokiLogQuery
                spec:
                  query: '{k8s_namespace_name=~".+"} |~ "level=(error|fatal)|\"level\":\\s*\"(error|fatal)\"|\\bERROR\\b|\\bFATAL\\b|Traceback
                    \\(most recent call last\\)|panic:"'
      metric-node-cpu:
        kind: Panel
        spec:
          display:
            name: Node CPU
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])))
      metric-node-memory:
        kind: Panel
        spec:
          display:
            name: Node Memory
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 100 * (1 - sum by (instance) (node_memory_MemAvailable_bytes)
                    / sum by (instance) (node_memory_MemTotal_bytes))
      metric-pod-restarts:
        kind: Panel
        spec:
          display:
            name: Pod Restarts
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (namespace) (increase(kube_pod_container_status_restarts_total[1h]))
                    > 0
- kind: Dashboard
  metadata:
    name: sample-web-web-red
    project: golden-cluster
  spec:
    display:
      name: "Web \xB7 Sample-web"
    duration: 1h
    layouts:
    - kind: Grid
      spec:
        items:
        - content:
            $ref: '#/spec/panels/metric-request-rate'
          height: 8
          width: 12
          x: 0
          y: 0
        - content:
            $ref: '#/spec/panels/metric-error-rate'
          height: 8
          width: 12
          x: 12
          y: 0
        - content:
            $ref: '#/spec/panels/metric-latency-p99'
          height: 8
          width: 12
          x: 0
          y: 8
        - content:
            $ref: '#/spec/panels/metric-memory-working-set'
          height: 8
          width: 12
          x: 12
          y: 8
        - content:
            $ref: '#/spec/panels/traces-slow-requests'
          height: 8
          width: 12
          x: 0
          y: 16
        - content:
            $ref: '#/spec/panels/logs-errors'
          height: 8
          width: 12
          x: 12
          y: 16
        - content:
            $ref: '#/spec/panels/logs-recent'
          height: 8
          width: 12
          x: 0
          y: 24
    panels:
      logs-errors:
        kind: Panel
        spec:
          display:
            description: Lines that carry an error level, a traceback or a panic.
              Prose that merely mentions an error can still match; there is no level
              field to filter on until the log line carries one.
            name: Errors (Logs)
          plugin:
            kind: LogsTable
            spec: {}
          queries:
          - kind: LogQuery
            spec:
              plugin:
                kind: LokiLogQuery
                spec:
                  query: '{k8s_namespace_name="sample"} |~ "level=(error|fatal)|\"level\":\\s*\"(error|fatal)\"|\\bERROR\\b|\\bFATAL\\b|Traceback
                    \\(most recent call last\\)|panic:"'
      logs-recent:
        kind: Panel
        spec:
          display:
            description: 'Every line, unfiltered: the log pipeline''s heartbeat.'
            name: Recent (Logs)
          plugin:
            kind: LogsTable
            spec: {}
          queries:
          - kind: LogQuery
            spec:
              plugin:
                kind: LokiLogQuery
                spec:
                  query: '{k8s_namespace_name="sample"}'
      metric-error-rate:
        kind: Panel
        spec:
          display:
            name: Error Rate
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(http_requests_total{job="sample-web", status=~"5.."}[5m]))
      metric-latency-p99:
        kind: Panel
        spec:
          display:
            name: Latency p99
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="sample-web"}[5m]))
                    by (le))
      metric-memory-working-set:
        kind: Panel
        spec:
          display:
            name: Memory Working Set
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (k8s_pod_name) (k8s_pod_memory_working_set{k8s_namespace_name="sample",
                    k8s_pod_name=~"sample-web-.*"})
      metric-request-rate:
        kind: Panel
        spec:
          display:
            name: Request Rate
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(http_requests_total{job="sample-web"}[5m]))
      traces-slow-requests:
        kind: Panel
        spec:
          display:
            name: Slow Requests (Traces)
          plugin:
            kind: TraceTable
            spec: {}
          queries:
          - kind: TraceQuery
            spec:
              plugin:
                kind: TempoTraceQuery
                spec:
                  query: '{resource.service.name="sample-web" && duration > 500ms}'
