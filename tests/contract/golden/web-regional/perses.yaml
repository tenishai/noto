- kind: Project
  metadata:
    name: golden-cluster
  spec:
    display:
      name: Argus - golden-cluster
- kind: Datasource
  metadata:
    name: mimir
    project: golden-cluster
  spec:
    default: true
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            headers:
              X-Scope-OrgID: golden-cluster
            url: http://mimir.us-east4.argus.internal:9009/prometheus
- kind: Datasource
  metadata:
    name: loki
    project: golden-cluster
  spec:
    default: true
    plugin:
      kind: LokiDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            headers:
              X-Scope-OrgID: golden-cluster
            url: http://loki.us-east4.argus.internal:3100
- kind: Datasource
  metadata:
    name: tempo
    project: golden-cluster
  spec:
    default: true
    plugin:
      kind: TempoDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            headers:
              X-Scope-OrgID: golden-cluster
            url: http://tempo.us-east4.argus.internal:3200
- kind: Dashboard
  metadata:
    name: cluster-baseline
    project: golden-cluster
  spec:
    display:
      name: cluster-baseline
    duration: 1h
    layouts:
    - kind: Grid
      spec:
        items:
        - content:
            $ref: '#/spec/panels/metric-node-cpu'
          height: 8
          width: 12
          x: 0
          y: 0
        - content:
            $ref: '#/spec/panels/metric-node-memory'
          height: 8
          width: 12
          x: 12
          y: 0
        - content:
            $ref: '#/spec/panels/metric-pod-restarts'
          height: 8
          width: 12
          x: 0
          y: 8
        - content:
            $ref: '#/spec/panels/logs-cluster-errors'
          height: 8
          width: 12
          x: 12
          y: 8
    panels:
      logs-cluster-errors:
        kind: Panel
        spec:
          display:
            name: logs:cluster-errors
          plugin:
            kind: LogsTable
            spec: {}
          queries:
          - kind: LogQuery
            spec:
              plugin:
                kind: LokiLogQuery
                spec:
                  query: '{service_name="sample-web"}'
      metric-node-cpu:
        kind: Panel
        spec:
          display:
            name: metric:node-cpu
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: up{job="sample-web"}
      metric-node-memory:
        kind: Panel
        spec:
          display:
            name: metric:node-memory
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: up{job="sample-web"}
      metric-pod-restarts:
        kind: Panel
        spec:
          display:
            name: metric:pod-restarts
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: up{job="sample-web"}
- kind: Dashboard
  metadata:
    name: web-red
    project: golden-cluster
  spec:
    display:
      name: web-red
    duration: 1h
    layouts:
    - kind: Grid
      spec:
        items:
        - content:
            $ref: '#/spec/panels/metric-request-rate'
          height: 8
          width: 12
          x: 0
          y: 0
        - content:
            $ref: '#/spec/panels/metric-error-rate'
          height: 8
          width: 12
          x: 12
          y: 0
        - content:
            $ref: '#/spec/panels/metric-latency-p99'
          height: 8
          width: 12
          x: 0
          y: 8
        - content:
            $ref: '#/spec/panels/metric-memory-working-set'
          height: 8
          width: 12
          x: 12
          y: 8
        - content:
            $ref: '#/spec/panels/traces-slow-requests'
          height: 8
          width: 12
          x: 0
          y: 16
        - content:
            $ref: '#/spec/panels/logs-errors'
          height: 8
          width: 12
          x: 12
          y: 16
    panels:
      logs-errors:
        kind: Panel
        spec:
          display:
            name: logs:errors
          plugin:
            kind: LogsTable
            spec: {}
          queries:
          - kind: LogQuery
            spec:
              plugin:
                kind: LokiLogQuery
                spec:
                  query: '{service_name="sample-web"}'
      metric-error-rate:
        kind: Panel
        spec:
          display:
            name: metric:error-rate
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(http_requests_total{job="sample-web", status=~"5.."}[5m]))
      metric-latency-p99:
        kind: Panel
        spec:
          display:
            name: metric:latency-p99
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="sample-web"}[5m]))
                    by (le))
      metric-memory-working-set:
        kind: Panel
        spec:
          display:
            name: metric:memory-working-set
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (k8s_pod_name) (k8s_pod_memory_working_set{k8s_namespace_name="sample",
                    k8s_pod_name=~"sample-web-.*"})
      metric-request-rate:
        kind: Panel
        spec:
          display:
            name: metric:request-rate
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(http_requests_total{job="sample-web"}[5m]))
      traces-slow-requests:
        kind: Panel
        spec:
          display:
            name: traces:slow-requests
          plugin:
            kind: TraceTable
            spec: {}
          queries:
          - kind: TraceQuery
            spec:
              plugin:
                kind: TempoTraceQuery
                spec:
                  query: '{resource.service.name="sample-web" && duration > 500ms}'
