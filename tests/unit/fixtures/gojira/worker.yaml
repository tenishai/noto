# Gojira app spec — this file is the contract between your repo and Gojira.
# Change the class or add overrides here; Gojira regenerates the manifests
# when this file changes.
app: clips-worker
class: worker
environments:
  - name: dev
    cluster: dev-cluster
    namespace: clips
  - name: qa
    cluster: qa-cluster
    namespace: clips
  - name: prod
    cluster: prod-cluster
    namespace: clips
