# The Argus OpenTelemetry Collector distribution (ocb manifest).
#
# Everything pinned to the v0.154.0 collector train (docs/versions.md); gomod lines
# sourced from the official otelcol-contrib manifest at the same tag, so they are
# known-good. Adding a component is a rebuild-and-release event (docs/design.md).
#
# Component set = exactly what the renderers emit (agent/argus/rendering/) plus the
# decided affordances:
#   - statsd receiver: legacy-ingest only, wired into no default pipeline (ADR).
#   - spanmetrics connector: available but unwired by default - Tempo's
#     metrics-generator owns span-metrics/service-graph (spike-verified); the
#     connector is the solo-topology fallback if a deployment disables it.
#   - prometheusremotewrite exporter: not in the happy path (native OTLP ingest
#     everywhere, spike-verified); kept for interop with external Prometheus stores.
#   - clickhouse exporter: the warehouse-sink seam default (ADR).
#   - loadbalancing exporter: required for future tail-sampling (trace-complete
#     routing to a single gateway replica).

dist:
  module: github.com/tenishai/argus/distro
  name: argus-otelcol
  description: Argus OpenTelemetry Collector distribution
  version: 0.154.0
  output_path: ./_build

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kubeletstatsreceiver v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kafkareceiver v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/statsdreceiver v0.154.0
  # argus-integrations autodiscovery (Phase 2): receiver_creator instantiates
  # per-integration sub-receivers on k8s_observer matches. Sub-receivers below.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/receivercreator v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/redisreceiver v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/nginxreceiver v0.154.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.154.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/groupbyattrsprocessor v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/k8sattributesprocessor v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/metricstransformprocessor v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.154.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.154.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.154.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/kafkaexporter v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/loadbalancingexporter v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusremotewriteexporter v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/clickhouseexporter v0.154.0

extensions:
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/observer/k8sobserver v0.154.0

connectors:
  - gomod: go.opentelemetry.io/collector/connector/forwardconnector v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/routingconnector v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/spanmetricsconnector v0.154.0
