apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-config
  namespace: obs
data:
  config.yaml: |
    security:
      enable_auth: false
    database:
      file:
        folder: /perses
        extension: yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perses
  namespace: obs
spec:
  replicas: 1
  selector: { matchLabels: { app: perses } }
  template:
    metadata: { labels: { app: perses } }
    spec:
      containers:
        - name: perses
          image: persesdev/perses:v0.53.1
          args: ["--config=/perses-config/config.yaml"]
          ports: [{ containerPort: 8080 }]
          volumeMounts:
            - { name: config, mountPath: /perses-config }
            - { name: data, mountPath: /perses }
      volumes:
        - name: config
          configMap: { name: perses-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: perses
  namespace: obs
spec:
  selector: { app: perses }
  ports: [{ name: http, port: 8080 }]
