apiVersion: batch/v1
kind: Job
metadata:
  name: gen-traces
  namespace: obs
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: gen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.154.0
          args:
            - traces
            - --otlp-endpoint=tempo.obs.svc:4317
            - --otlp-insecure
            - --rate=20
            - --duration=60s
            - --workers=4
            - --otlp-attributes=service.name="clips-api"
            - --otlp-attributes=k8s.cluster.name="argus-spike"
            - --otlp-attributes=k8s.namespace.name="clips"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gen-metrics
  namespace: obs
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: gen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.154.0
          args:
            - metrics
            - --otlp-endpoint=mimir.obs.svc:9009
            - --otlp-insecure
            - --otlp-http
            - --otlp-http-url-path=/otlp/v1/metrics
            - --rate=50
            - --duration=60s
            - --workers=2
            - --otlp-attributes=service.name="clips-api"
            - --otlp-attributes=k8s.cluster.name="argus-spike"
---
