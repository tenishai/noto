apiVersion: v1
kind: Namespace
metadata:
  name: obs
---
# ---------- Mimir 3.1.1 (monolithic, filesystem storage, anon tenant) ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: obs
data:
  mimir.yaml: |
    target: all
    multitenancy_enabled: false
    server:
      http_listen_port: 9009
      grpc_listen_port: 9095
    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /data/mimir
    blocks_storage:
      bucket_store:
        sync_dir: /data/tsdb-sync
      tsdb:
        dir: /data/tsdb
    compactor:
      data_dir: /data/compactor
    ingester:
      ring:
        replication_factor: 1
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    store_gateway:
      sharding_ring:
        replication_factor: 1
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/ruler
    limits:
      max_global_series_per_user: 1000000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: obs
spec:
  replicas: 1
  selector: { matchLabels: { app: mimir } }
  template:
    metadata: { labels: { app: mimir } }
    spec:
      containers:
        - name: mimir
          image: grafana/mimir:3.1.1
          args: ["-config.file=/etc/mimir/mimir.yaml"]
          ports: [{ containerPort: 9009 }]
          volumeMounts:
            - { name: config, mountPath: /etc/mimir }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: mimir-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: obs
spec:
  selector: { app: mimir }
  ports: [{ name: http, port: 9009 }]
---
# ---------- Loki 3.7.2 (single binary, filesystem, auth off) ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: obs
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      instance_addr: 127.0.0.1
      path_prefix: /data/loki
      storage:
        filesystem:
          chunks_directory: /data/loki/chunks
          rules_directory: /data/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
      otlp_config:
        resource_attributes:
          attributes_config:
            - action: index_label
              attributes: [service.name, k8s.namespace.name, k8s.cluster.name]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: obs
spec:
  replicas: 1
  selector: { matchLabels: { app: loki } }
  template:
    metadata: { labels: { app: loki } }
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.7.2
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports: [{ containerPort: 3100 }]
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: obs
spec:
  selector: { app: loki }
  ports: [{ name: http, port: 3100 }]
---
# ---------- Tempo 2.10.7 (single binary, local storage) ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: obs
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      max_block_duration: 5m
    storage:
      trace:
        backend: local
        local:
          path: /data/tempo/blocks
        wal:
          path: /data/tempo/wal
    metrics_generator:
      registry:
        external_labels:
          source: tempo
      storage:
        path: /data/tempo/generator/wal
        remote_write:
          - url: http://mimir.obs.svc:9009/api/v1/push
      traces_storage:
        path: /data/tempo/generator/traces
    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: obs
spec:
  replicas: 1
  selector: { matchLabels: { app: tempo } }
  template:
    metadata: { labels: { app: tempo } }
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.10.7
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports: [{ containerPort: 3200 }, { containerPort: 4317 }, { containerPort: 4318 }]
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: tempo-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: obs
spec:
  selector: { app: tempo }
  ports:
    - { name: http, port: 3200 }
    - { name: otlp-grpc, port: 4317 }
    - { name: otlp-http, port: 4318 }
