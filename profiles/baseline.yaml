# Argus baseline profile - what every app and cluster gets, before any class opinion.
# Layered composition: baseline + class + per-app override (docs/design.md).
budgets:
  retention: { metrics: 30d, logs: 7d, traces: 7d }
  cardinality: { dev: 200000, qa: 500000, prod: 1000000 }
drop:
  - name: health-endpoints
    stage: agent
    path_matches: [/health, /healthz, /ready, /livez]
  - name: debug-logs
    stage: agent
    log_level_below: info
  - name: ksm-churn
    stage: gateway
    metric_names:
      - kube_pod_status_reason
      - kube_pod_tolerations
      - kube_pod_status_qos_class
      - kube_pod_status_ready
      - kube_pod_status_scheduled
  - name: unbounded-labels
    stage: gateway
    metric_labels_strip: [pod_uid, request_id]
  - name: kube-system-noise
    stage: gateway
    namespace_exclude: [kube-system]
  - name: alertmanager-system-metrics
    stage: gateway
    justification: Alertmanager metrics are platform internals not used in observability; dropping frees cardinality budget for app signals
    metric_names: ["alertmanager_.+"]
  - name: hostmetrics-duplicates
    stage: gateway
    justification: Agent hostmetrics system.* duplicates node-exporter's node_* (the baseline dashboard source) and nothing queries it; system_cpu_time is the top cardinality offender. Matcher covers the OTLP dotted name (system.cpu.time) seen at the gateway and the Prometheus underscored form. Follow-up - remove the hostmetrics scrapers from the agent render so the drop rule is not hiding a source bug.
    metric_names: ["system[._].+"]
dashboards:
  - name: cluster-baseline
    panels: ["metric:node-cpu", "metric:node-memory", "metric:pod-restarts", "logs:cluster-errors"]
